<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BravoCloud Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">
  
  <!-- Sidebar List of Users -->
  <div class="w-80 border-r border-[#27272a] bg-[#121214] flex flex-col h-full">
    <div class="p-5 border-b border-[#27272a]">
      <h1 class="text-xl font-bold tracking-tight">Agent Dashboard</h1>
      <p class="text-sm text-[#a1a1aa] mt-1">Live Support Chats</p>
    </div>
    <div id="user-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 flex flex-col gap-1">
      <!-- User items will be injected here -->
      <div class="text-sm text-[#a1a1aa] p-4 text-center mt-4">Waiting for chats...</div>
    </div>
  </div>

  <!-- Chat Window -->
  <div class="flex-1 flex flex-col bg-black relative">
    <div id="chat-header" class="p-5 border-b border-[#27272a] bg-[#121214]/50 backdrop-blur-md hidden justify-between items-center z-10">
      <div>
        <h2 id="chat-title" class="font-semibold text-lg">Select a user</h2>
        <p id="chat-subtitle" class="text-xs text-[#a1a1aa]">...</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span class="text-xs font-medium text-green-500">Live</span>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-[#a1a1aa]">
      <svg class="w-16 h-16 mb-4 text-[#27272a]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <h3 class="text-lg font-medium text-white mb-1">No Chat Selected</h3>
      <p class="text-sm">Click a user on the left to start responding.</p>
    </div>

    <div id="messages-container" class="flex-1 overflow-y-auto custom-scrollbar p-6 flex flex-col gap-4 hidden">
      <!-- Messages injected here -->
    </div>

    <div id="chat-input-area" class="p-4 border-t border-[#27272a] bg-[#121214] hidden">
      <form id="chat-form" class="flex gap-3">
        <input type="text" id="message-input" autocomplete="off" placeholder="Type your response..." class="flex-1 bg-[#18181b] border border-[#27272a] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#3f3f46] text-white transition-colors" />
        <button type="submit" class="bg-white text-black px-6 py-3 rounded-xl font-semibold text-sm hover:bg-gray-200 transition-colors shadow-lg shadow-white/10">Send</button>
      </form>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket'] });
    let currentRoom = null;
    let chats = {}; // { roomId: { userName, lastMessage, messages: [] } }

    const userListEl = document.getElementById('user-list');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatHeader = document.getElementById('chat-header');
    const chatInputArea = document.getElementById('chat-input-area');
    const emptyState = document.getElementById('empty-state');
    const chatTitle = document.getElementById('chat-title');
    const chatSubtitle = document.getElementById('chat-subtitle');

    // Join as admin to get all notifications
    socket.emit('join_room', { roomId: 'admin', isAdmin: true });

    socket.on('admin_receive_message', (msg) => {
      const { roomId, senderName, text, isAdmin, timestamp } = msg;
      
      if (!chats[roomId]) {
        chats[roomId] = { userName: isAdmin ? 'User' : senderName, messages: [], lastMessage: '' };
      }
      
      chats[roomId].messages.push(msg);
      chats[roomId].lastMessage = text;

      if (!isAdmin && senderName) {
        chats[roomId].userName = senderName;
      }

      renderUserList();
      
      if (currentRoom === roomId) {
        renderMessages();
      }
    });

    function selectRoom(roomId) {
      currentRoom = roomId;
      socket.emit('join_room', { roomId, isAdmin: true }); // Ensure we are listening closely
      
      emptyState.classList.add('hidden');
      chatHeader.classList.remove('hidden');
      chatHeader.classList.add('flex');
      messagesContainer.classList.remove('hidden');
      chatInputArea.classList.remove('hidden');

      chatTitle.textContent = chats[roomId]?.userName || roomId;
      chatSubtitle.textContent = `Room ID: ${roomId}`;

      renderUserList();
      renderMessages();
    }

    function renderUserList() {
      if (Object.keys(chats).length === 0) return;
      userListEl.innerHTML = '';
      
      Object.entries(chats).forEach(([roomId, chat]) => {
        const isActive = currentRoom === roomId;
        const div = document.createElement('div');
        div.className = `p-3 rounded-xl cursor-pointer transition-colors border ${isActive ? 'bg-[#27272a]/50 border-[#3f3f46]' : 'bg-transparent border-transparent hover:bg-[#18181b]'}`;
        div.onclick = () => selectRoom(roomId);
        
        div.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-medium text-sm text-white">${chat.userName || roomId}</span>
            <span class="w-2 h-2 rounded-full bg-blue-500 mt-1.5"></span>
          </div>
          <p class="text-xs text-[#a1a1aa] truncate">${chat.lastMessage}</p>
        `;
        userListEl.appendChild(div);
      });
    }

    function renderMessages() {
      if (!currentRoom || !chats[currentRoom]) return;
      messagesContainer.innerHTML = '';
      
      chats[currentRoom].messages.forEach(msg => {
        const isMe = msg.isAdmin;
        const div = document.createElement('div');
        div.className = `flex flex-col max-w-[75%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`;
        
        div.innerHTML = `
          <span class="text-[11px] text-[#71717a] mb-1 px-1">${isMe ? 'You (Agent)' : (msg.senderName || 'User')}</span>
          <div class="px-4 py-2.5 rounded-2xl text-sm ${isMe ? 'bg-white text-black rounded-tr-sm' : 'bg-[#27272a] text-white rounded-tl-sm'}">
            ${msg.text}
          </div>
        `;
        messagesContainer.appendChild(div);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentRoom) return;

      socket.emit('send_message', {
        roomId: currentRoom,
        senderId: 'admin',
        senderName: 'Support Agent',
        text,
        isAdmin: true
      });

      messageInput.value = '';
    };

  </script>
</body>
</html>
